<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ঈশ্বরমনি কুঠির — Push পাঠান</title><style>body{margin:0;background:#31070d;color:#fff2d1;font-family:system-ui,'Noto Sans Bengali',sans-serif;padding:20px}.wrap{max-width:560px;margin:30px auto;background:#4b0d15;border:1px solid #c59b49;border-radius:20px;padding:22px}h1{font-size:24px}label{display:block;margin-top:15px}input,textarea{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;border:1px solid #c59b49;background:#fffaf0;color:#31070d;font:inherit}button{margin-top:18px;padding:13px 18px;border:0;border-radius:12px;background:#e6bd55;color:#31070d;font-weight:800;font:inherit}#status{white-space:pre-wrap;line-height:1.7;margin-top:15px}</style></head><body><main class="wrap"><h1>🔔 Push Notification পাঠান</h1><p>শুধু অনুমতি দেওয়া ডিভাইসগুলোতে পাঠানো হবে। Admin secret কখনো index.html-এ বসাবেন না।</p><form id="f"><label>Admin Secret</label><input id="secret" type="password" autocomplete="current-password" required><label>শিরোনাম</label><input id="title" maxlength="120" required placeholder="যেমন: পূজার সময়সূচি ঘোষণা"><label>বার্তা</label><textarea id="body" maxlength="1500" rows="4" required placeholder="নোটিশের বিস্তারিত লিখুন"></textarea><label>ক্লিক করলে যে পেজ খুলবে (ঐচ্ছিক)</label><input id="url" value="/" placeholder="/ অথবা /index.html#utsav"><button type="submit">সব সাবস্ক্রাইবারকে পাঠান</button></form><div id="status" role="status"></div></main><script>
const PROJECT='https://evkjwiicnzruijfthwpm.supabase.co';const ANON='sb_publishable_jZoDvrriWst7JRwnicUWIQ_HjzTZD2d';
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const status=document.getElementById('status');status.textContent='পাঠানো হচ্ছে…';try{const r=await fetch(PROJECT+'/functions/v1/send-push',{method:'POST',headers:{'Content-Type':'application/json','apikey':ANON,'Authorization':'Bearer '+ANON,'x-admin-secret':document.getElementById('secret').value},body:JSON.stringify({title:document.getElementById('title').value,body:document.getElementById('body').value,url:document.getElementById('url').value||'/'})});const d=await r.json();if(!r.ok)throw Error(d.error||('HTTP '+r.status));status.textContent=`সম্পন্ন। মোট: ${d.total}\nপাঠানো হয়েছে: ${d.sent}\nব্যর্থ: ${d.failed}\nঅকার্যকর সাবস্ক্রিপশন মুছে ফেলা: ${d.removed}`;}catch(err){status.textContent='ব্যর্থ: '+err.message+'\nFunction ও secrets সেট করা আছে কি না দেখুন।'}});
</script></body></html>
