<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#681522"><meta name="description" content="ঈশ্বরমনি কুঠির পূজা উদযাপন কমিটির সদস্যবৃন্দ।">
<title>ঈশ্বরমনি কুঠির পূজা উদযাপন কমিটি</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--maroon:#681522;--deep:#35070e;--gold:#d7a83d;--cream:#fff8e9;--ink:#35151a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#fff8e9,#fff);font-family:'Noto Serif Bengali',serif;color:var(--ink);line-height:1.7}.top{position:sticky;top:0;z-index:5;background:var(--deep);color:#ffe8a8;padding:13px max(16px,calc((100vw - 1050px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #b98a37}.brand{font-weight:800;color:inherit;text-decoration:none}.actions{display:flex;align-items:center;gap:8px}.lang{display:flex;background:#fff4d9;border-radius:99px;padding:4px}.lang button{border:0;background:transparent;color:var(--deep);border-radius:99px;padding:7px 12px;font:inherit;font-weight:700;cursor:pointer}.lang button.active{background:var(--maroon);color:#fff}.back{color:#ffe8a8;text-decoration:none;border:1px solid #9f7b45;border-radius:99px;padding:7px 12px;font-size:13px}.wrap{width:min(1050px,calc(100% - 28px));margin:36px auto 64px}.hero{text-align:center;padding:18px 10px 28px}.eyebrow{color:#a37a2c;font-weight:800}.hero h1{font-size:clamp(28px,5vw,44px);color:var(--maroon);line-height:1.35;margin:7px 0}.hero p{color:#755b55;margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.person{display:flex;align-items:center;gap:14px;padding:17px 18px;border:1px solid #ead9b6;border-radius:16px;background:#fffdf8;box-shadow:0 8px 24px #4c19140b;min-width:0}.number{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border-radius:50%;background:var(--maroon);color:#f5d37e;font-weight:800}.role{font-size:13px;color:#8c6a36;margin-bottom:4px;font-weight:700}.name{font-size:17px;font-weight:800;color:#351016;overflow-wrap:anywhere}.status{text-align:center;color:#765e53;font-size:13px;margin-top:20px}.foot{text-align:center;margin-top:38px;color:#8a6b62;font-size:13px}@media(max-width:620px){.grid{grid-template-columns:1fr;gap:10px}.person{padding:14px}.name{font-size:16px}.top{padding:12px}.brand{font-size:14px}.back{font-size:12px;padding:6px 9px}}
</style></head>
<body>
<header class="top"><a class="brand" href="index.html">🪔 ঈশ্বরমনি কুঠির</a><div class="actions"><div class="lang"><button id="bnBtn" class="active" onclick="setLang('bn')">বাংলা</button><button id="enBtn" onclick="setLang('en')">EN</button></div><a class="back" href="index.html" data-bn="মূল ওয়েবসাইট" data-en="Main website">মূল ওয়েবসাইট</a></div></header>
<main class="wrap"><section class="hero"><div class="eyebrow" data-bn="🙏 আমাদের পরিচালনা" data-en="🙏 OUR COMMITTEE">🙏 আমাদের পরিচালনা</div><h1 data-bn="ঈশ্বরমনি কুঠির পূজা উদযাপন কমিটি" data-en="Ishwarmani Kutir Puja Celebration Committee">ঈশ্বরমনি কুঠির পূজা উদযাপন কমিটি</h1><p data-bn="পূজার আয়োজন ও পরিচালনায় যুক্ত কমিটির সদস্যবৃন্দ" data-en="Members involved in organizing and managing the Puja">পূজার আয়োজন ও পরিচালনায় যুক্ত কমিটির সদস্যবৃন্দ</p></section>
<div id="committeeMembers" class="grid" aria-live="polite"></div><p id="status" class="status" aria-live="polite"></p><footer class="foot" data-bn="ঈশ্বরমনি কুঠির • সাহা বাড়ি • খড়মা, দেওয়ানগঞ্জ, জামালপুর" data-en="Ishwarmani Kutir • Saha Family Home • Kharma, Dewanganj, Jamalpur">ঈশ্বরমনি কুঠির • সাহা বাড়ি • খড়মা, দেওয়ানগঞ্জ, জামালপুর</footer></main>
<script>
const SUPABASE_URL='https://evkjwiicnzruijfthwpm.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_jZoDvrriWst7JRwnicUWIQ_HjzTZD2d';
const DEFAULT_MEMBERS=[{role:'সভাপতি',name:'শ্রী বিমল সাহা'},{role:'সহ সভাপতি',name:'শ্রী রবিন্দ্রনাথ সাহা'},{role:'সহ সভাপতি',name:'শ্রী সুধন সাহা'},{role:'সাধারণ সম্পাদক',name:'শ্রী মতিলাল সাহা'},{role:'যুগ্ম সম্পাদক',name:'শ্রী রিপন সাহা'},{role:'সহ সাধারণ সম্পাদক',name:'শ্রী সোভন সাহা'},{role:'অর্থ সম্পাদক',name:'শ্রী লিটন সাহা'},{role:'সহ অর্থ সম্পাদক',name:'শ্রী বিশ্বনাথ সাহা'},{role:'মন্দির সংস্কার ও উন্নয়ন বিষয়ক সম্পাদক',name:'শ্রী রনজিৎ কুমার সাহা'},{role:'মহিলা বিষয়ক সম্পাদিকা',name:'মুক্তি রানি সাহা'},{role:'সহ মহিলা বিষয়ক সম্পাদিকা',name:'লিপি রানি সাহা'},{role:'পূজা ও ধর্ম বিষয়ক সম্পাদিকা',name:'আন্না রানি সাহা'},{role:'সদস্য',name:'পপি রানি সাহা'},{role:'সদস্য',name:'লিপি সাহা'}];
const ROLE_EN={'সভাপতি':'President','সহ সভাপতি':'Vice President','সাধারণ সম্পাদক':'General Secretary','যুগ্ম সম্পাদক':'Joint Secretary','সহ সাধারণ সম্পাদক':'Assistant General Secretary','অর্থ সম্পাদক':'Treasurer','সহ অর্থ সম্পাদক':'Assistant Treasurer','মন্দির সংস্কার ও উন্নয়ন বিষয়ক সম্পাদক':'Temple Renovation & Development Secretary','মহিলা বিষয়ক সম্পাদিকা':'Women’s Affairs Secretary','সহ মহিলা বিষয়ক সম্পাদিকা':'Assistant Women’s Affairs Secretary','পূজা ও ধর্ম বিষয়ক সম্পাদিকা':'Puja & Religious Affairs Secretary','সদস্য':'Member'};let lang='bn',members=DEFAULT_MEMBERS;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){const el=document.getElementById('committeeMembers');el.innerHTML=members.filter(x=>x&&String(x.role||'').trim()&&String(x.name||'').trim()).map((x,i)=>`<article class="person"><div class="number">${i+1}</div><div><div class="role">${esc(lang==='en'?(ROLE_EN[x.role]||x.role):x.role)}</div><div class="name">${esc(x.name)}</div></div></article>`).join('');}
async function load(){try{const r=await fetch(SUPABASE_URL+'/rest/v1/website_content?select=section,content&section=eq.committee',{headers:{'apikey':SUPABASE_PUBLISHABLE_KEY}});if(r.ok){const d=await r.json();if(d[0]?.content?.members&&Array.isArray(d[0].content.members))members=d[0].content.members;}render();document.getElementById('status').textContent='';}catch(e){render();document.getElementById('status').textContent=lang==='bn'?'কমিটির সংরক্ষিত তথ্য লোড করা যায়নি; ডিফল্ট তালিকা দেখানো হচ্ছে।':'Could not load saved committee details; showing the default list.';}}
function setLang(v){lang=v;document.documentElement.lang=v;document.querySelectorAll('[data-bn][data-en]').forEach(e=>e.textContent=e.dataset[v]);document.getElementById('bnBtn').classList.toggle('active',v==='bn');document.getElementById('enBtn').classList.toggle('active',v==='en');document.title=v==='bn'?'ঈশ্বরমনি কুঠির পূজা উদযাপন কমিটি':'Ishwarmani Kutir Puja Celebration Committee';render();}
load();
</script></body></html>
