<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6f1118"><title>নোটিফিকেশন | ঈশ্বরমনি কুঠির</title>
<style>
:root{--wine:#6f1118;--gold:#d6a84f;--line:#ead7b0}*{box-sizing:border-box}body{margin:0;background:#fff8e9;font-family:system-ui,"Noto Sans Bengali",sans-serif;color:#351014}.wrap{max-width:950px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#30080d,#74151e);color:white;padding:22px;border-radius:18px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:17px;margin:14px 0}h1,h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin:8px 0 5px}input,textarea,select{width:100%;font:inherit;padding:11px;border:1px solid #d8c6b1;border-radius:10px}textarea{min-height:100px}.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--wine);color:white;font:inherit;font-weight:750;cursor:pointer}.secondary{background:#f1e2c8;color:#4b161b}.danger{background:#a32132}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hidden{display:none!important}.muted{font-size:.9rem;color:#755e59;line-height:1.5}.status{padding:8px 0}.item{border:1px solid #eadfce;border-radius:12px;padding:13px;margin-top:10px}.item p{white-space:pre-wrap;overflow-wrap:anywhere}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.pill{font-size:.8rem;background:#f4e7cc;color:#6f1118;padding:4px 9px;border-radius:20px}@media(max-width:620px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><main class="wrap">
<header class="hero"><h1>🔔 নোটিফিকেশন ম্যানেজার</h1><p>ওয়েবসাইটের দর্শনার্থীদের জন্য ঘোষণা তৈরি ও প্রকাশ করুন।</p></header>
<section class="card" id="loginCard"><h2>Admin Login</h2><p class="muted">Admin Panel-এর একই Supabase Auth email ও password ব্যবহার করুন।</p><form id="loginForm"><label>Email</label><input id="email" type="email" required autocomplete="username"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><div class="actions"><button class="btn">Login</button><a class="btn secondary" href="admin.html">Admin Panel</a></div></form></section>
<section id="app" class="hidden"><section class="card"><div class="topline"><h2 id="formTitle">নতুন নোটিফিকেশন</h2><button class="btn secondary" id="logout">Logout</button></div>
<form id="noticeForm"><input id="noticeId" type="hidden"><div class="grid"><div class="full"><label>শিরোনাম</label><input id="title" maxlength="120" required></div><div class="full"><label>বার্তা</label><textarea id="bodyText" maxlength="2000" required></textarea></div><div><label>ধরন</label><select id="category"><option value="announcement">ঘোষণা</option><option value="event">অনুষ্ঠান</option><option value="gallery">নতুন ছবি</option><option value="important">জরুরি তথ্য</option></select></div><div><label>ক্লিক করলে যে পেজ খুলবে</label><input id="targetUrl" value="/" placeholder="/gallery.html"></div><div class="full"><label><input id="published" type="checkbox" style="width:auto"> Save করার সঙ্গে সঙ্গে প্রকাশ করুন</label><p class="muted">এটি ওয়েবসাইটের ভেতরের নোটিফিকেশন। ব্রাউজার বন্ধ থাকলেও Push পাঠাবে না।</p></div></div><div class="actions"><button class="btn" id="save">Save Notification</button><button class="btn secondary" type="button" id="reset">নতুন করে লিখুন</button></div></form><div id="status" class="status" role="status"></div></section>
<section class="card"><div class="topline"><h2>নোটিফিকেশন তালিকা</h2><button class="btn secondary" id="refresh">↻ Refresh</button></div><div id="listStatus" class="muted">লোড হচ্ছে…</div><div id="list"></div></section></section></main>
<script>
const U='https://evkjwiicnzruijfthwpm.supabase.co',K='sb_publishable_jZoDvrriWst7JRwnicUWIQ_HjzTZD2d';let token=sessionStorage.getItem('ishwarmani_admin_token')||'',items=[];const $=id=>document.getElementById(id),H=()=>({apikey:K,Authorization:'Bearer '+token,'Content-Type':'application/json'});function msg(s){$('status').textContent=s}function show(){ $('loginCard').classList.add('hidden');$('app').classList.remove('hidden');load()}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{let r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})}),d=await r.json();if(!r.ok)throw Error(d.error_description||d.message||'Login failed');token=d.access_token;sessionStorage.setItem('ishwarmani_admin_token',token);if(d.refresh_token)sessionStorage.setItem('ishwarmani_admin_refresh',d.refresh_token);show()}catch(e){alert('Login হয়নি: '+e.message)}};
function reset(){ $('noticeForm').reset();$('noticeId').value='';$('targetUrl').value='/';$('formTitle').textContent='নতুন নোটিফিকেশন';$('save').textContent='Save Notification';msg('')}
$('reset').onclick=reset;$('refresh').onclick=load;$('logout').onclick=()=>{sessionStorage.removeItem('ishwarmani_admin_token');sessionStorage.removeItem('ishwarmani_admin_refresh');token='';location.reload()};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){ $('listStatus').textContent='লোড হচ্ছে…';try{let r=await fetch(U+'/rest/v1/site_notifications?select=*&order=created_at.desc',{headers:H()}),d=await r.json();if(!r.ok)throw Error(d.message||d.hint||'site_notifications table নেই—SQL ফাইলটি Supabase-এ Run করুন');items=d;$('listStatus').textContent=d.length?'মোট '+d.length+'টি':'এখনো কোনো নোটিফিকেশন নেই';$('list').innerHTML=d.map(n=>`<article class="item"><div class="topline"><h3>${esc(n.title)}</h3><span class="pill">${n.is_published?'প্রকাশিত':'Draft'}</span></div><p>${esc(n.body)}</p><div class="muted">${esc(n.category)} · ${n.created_at?new Date(n.created_at).toLocaleString('bn-BD'):''}</div><div class="actions"><button class="btn secondary" onclick="editN(${Number(n.id)})">Edit</button><button class="btn secondary" onclick="publishN(${Number(n.id)},${!n.is_published})">${n.is_published?'Unpublish':'Publish'}</button><button class="btn danger" onclick="deleteN(${Number(n.id)})">Delete</button></div></article>`).join('')}catch(e){$('listStatus').textContent='❌ '+e.message}}
$('noticeForm').onsubmit=async e=>{e.preventDefault();let id=$('noticeId').value,target=$('targetUrl').value.trim()||'/';if(!target.startsWith('/')&&!target.startsWith('https://ishwar-moni-kutir.vercel.app/')){msg('নিজের ওয়েবসাইটের path দিন, যেমন /gallery.html');return}let p={title:$('title').value.trim(),body:$('bodyText').value.trim(),category:$('category').value,target_url:target,is_published:$('published').checked,updated_at:new Date().toISOString()};$('save').disabled=true;try{let r=await fetch(U+'/rest/v1/site_notifications'+(id?'?id=eq.'+encodeURIComponent(id):''),{method:id?'PATCH':'POST',headers:{...H(),Prefer:'return=representation'},body:JSON.stringify(p)}),d=await r.json().catch(()=>[]);if(!r.ok)throw Error(d.message||d.hint||'Save হয়নি');msg(p.is_published?'নোটিফিকেশন প্রকাশিত হয়েছে।':'Draft Save হয়েছে।');reset();await load()}catch(e){msg('❌ '+e.message)}finally{$('save').disabled=false}};
window.editN=id=>{let n=items.find(x=>Number(x.id)===id);if(!n)return;$('noticeId').value=n.id;$('title').value=n.title;$('bodyText').value=n.body;$('category').value=n.category||'announcement';$('targetUrl').value=n.target_url||'/';$('published').checked=!!n.is_published;$('formTitle').textContent='নোটিফিকেশন Edit';$('save').textContent='পরিবর্তন Save';scrollTo({top:0,behavior:'smooth'})};
window.publishN=async(id,v)=>{try{let r=await fetch(U+'/rest/v1/site_notifications?id=eq.'+id,{method:'PATCH',headers:{...H(),Prefer:'return=minimal'},body:JSON.stringify({is_published:v,updated_at:new Date().toISOString()})});if(!r.ok)throw Error('Status বদলানো যায়নি');load()}catch(e){alert(e.message)}};
window.deleteN=async id=>{if(!confirm('এই নোটিফিকেশন মুছে ফেলবেন?'))return;try{let r=await fetch(U+'/rest/v1/site_notifications?id=eq.'+id,{method:'DELETE',headers:{...H(),Prefer:'return=minimal'}});if(!r.ok)throw Error('Delete হয়নি');load()}catch(e){alert(e.message)}};
if(token)show();
</script></body></html>
