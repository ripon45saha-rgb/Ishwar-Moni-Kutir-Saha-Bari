<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ঈশ্বরমনি কুঠির — Admin Panel</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#fff8eb;color:#32100e}
.wrap{max-width:1200px;margin:auto;padding:20px}.card{background:white;border:1px solid #ead7b0;border-radius:18px;padding:20px;box-shadow:0 8px 30px rgba(70,25,10,.08)}
.login{max-width:430px;margin:8vh auto}h1{margin:0 0 8px;color:#7a1717}h2{margin-top:0}
label{display:block;font-weight:700;margin:14px 0 7px}input{width:100%;padding:13px;border:1px solid #d9c49c;border-radius:10px;background:#fff}
.btn{border:0;border-radius:10px;padding:12px 18px;background:#7a1717;color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#e9d7b0;color:#42110f}
.msg{margin-top:12px;padding:10px;border-radius:10px;display:none}.err{background:#ffe2e2;color:#8a1010}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}.stat{background:#fff;border:1px solid #ead7b0;border-radius:16px;padding:18px}
.stat b{display:block;font-size:30px;color:#7a1717;margin-top:5px}.table-wrap{overflow:auto;border-radius:14px;border:1px solid #ead7b0}
table{width:100%;border-collapse:collapse;min-width:850px;background:#fff}th,td{padding:12px;border-bottom:1px solid #eee1c7;text-align:left;vertical-align:top}
th{background:#7a1717;color:#fff;position:sticky;top:0}tr:hover td{background:#fffaf1}.small{font-size:13px;color:#725b52}
.empty{text-align:center;padding:35px;color:#765e55}@media(max-width:700px){.wrap{padding:12px}.stats{grid-template-columns:1fr}.login{margin:4vh auto}}
</style>
</head>
<body>
<div class="wrap">
<section id="loginBox" class="card login">
<h1>🪔 ঈশ্বরমনি কুঠির</h1><h2>Admin Panel</h2>
<p class="small">শুধু মন্দিরের প্রশাসকের জন্য।</p>
<label>Admin Email</label><input id="email" type="email" autocomplete="username" placeholder="আপনার admin email">
<label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="আপনার password">
<br><br><button class="btn" onclick="login()">🔐 Login</button><div id="loginMsg" class="msg err"></div>
</section>
<section id="dashboard" style="display:none">
<div class="top"><div><h1>🪔 Admin Dashboard</h1><div class="small">ঈশ্বরমনি কুঠির — দর্শনার্থী তথ্য</div></div>
<div><button class="btn secondary" onclick="loadVisitors()">↻ Refresh</button> <button class="btn" onclick="logout()">Logout</button></div></div>
<div class="stats">
<div class="stat">মোট দর্শনার্থী<b id="total">0</b></div><div class="stat">গড় Rating<b id="avg">—</b></div><div class="stat">আজকের দর্শনার্থী<b id="today">0</b></div>
</div>
<div class="card"><div class="top"><h2>👥 Visitor Information</h2><input id="search" style="max-width:330px" placeholder="নাম / জেলা / উপজেলা খুঁজুন..." oninput="render()"></div>
<div id="status" class="small"></div><div class="table-wrap"><table><thead><tr><th>#</th><th>নাম</th><th>জেলা</th><th>উপজেলা</th><th>মতামত</th><th>Rating</th><th>সময়</th></tr></thead>
<tbody id="rows"><tr><td colspan="7" class="empty">Loading...</td></tr></tbody></table></div></div>
</section></div>
<script>
const SUPABASE_URL='https://evkjwiicnzruijfthwpm.supabase.co', SUPABASE_KEY='sb_publishable_jZoDvrriWst7JRwnicUWIQ_HjzTZD2d';
let accessToken=sessionStorage.getItem("ishwarmani_admin_token")||"", visitors=[];
function h(){return {"apikey":SUPABASE_KEY,"Authorization":"Bearer "+accessToken}}
function showMsg(t){let e=document.getElementById("loginMsg");e.textContent=t;e.style.display="block"}
async function login(){
let email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
if(!email||!password)return showMsg("Email ও password দিন।");
try{let r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})}),d=await r.json();
if(!r.ok)throw Error(d.error_description||d.msg||"Login failed");accessToken=d.access_token;sessionStorage.setItem("ishwarmani_admin_token",accessToken);
document.getElementById("loginBox").style.display="none";document.getElementById("dashboard").style.display="block";loadVisitors()}catch(e){showMsg(e.message)}}
async function loadVisitors(){
document.getElementById("status").textContent="তথ্য লোড হচ্ছে...";
try{let r=await fetch(SUPABASE_URL+"/rest/v1/visitors?select=*&order=created_at.desc",{headers:h()}),d=await r.json();
if(!r.ok)throw Error(d.message||"Data load failed");visitors=Array.isArray(d)?d:[];updateStats();render();document.getElementById("status").textContent=visitors.length+"টি visitor record পাওয়া গেছে।"}
catch(e){document.getElementById("status").textContent="Error: "+e.message}}
function ratingNumber(v){if(v==null)return null;let s=String(v).replace(/[০-৯]/g,c=>"০১২৩৪৫৬৭৮৯".indexOf(c)).replace("/","");let m=s.match(/\d+(?:\.\d+)?/);return m?Number(m[0]):null}
function updateStats(){document.getElementById("total").textContent=visitors.length;let n=visitors.map(v=>ratingNumber(v.rating)).filter(x=>x!==null&&x<=10);document.getElementById("avg").textContent=n.length?(n.reduce((a,b)=>a+b,0)/n.length).toFixed(1)+"/10":"—";let day=new Date().toLocaleDateString("en-CA");document.getElementById("today").textContent=visitors.filter(v=>v.created_at&&new Date(v.created_at).toLocaleDateString("en-CA")===day).length}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){let q=document.getElementById("search").value.toLowerCase().trim(),list=visitors.filter(v=>[v.name,v.district,v.upazila,v.opinion,v.rating].some(x=>String(x||"").toLowerCase().includes(q))),b=document.getElementById("rows");if(!list.length){b.innerHTML='<tr><td colspan="7" class="empty">কোনো তথ্য পাওয়া যায়নি।</td></tr>';return}b.innerHTML=list.map((v,i)=>`<tr><td>${i+1}</td><td>${esc(v.name)}</td><td>${esc(v.district)}</td><td>${esc(v.upazila)}</td><td>${esc(v.opinion||"—")}</td><td><b>${esc(v.rating||"—")}</b></td><td>${v.created_at?new Date(v.created_at).toLocaleString("bn-BD"):"—"}</td></tr>`).join("")}
function logout(){sessionStorage.removeItem("ishwarmani_admin_token");accessToken="";location.reload()}
if(accessToken){document.getElementById("loginBox").style.display="none";document.getElementById("dashboard").style.display="block";loadVisitors()}
</script>
</body></html>
